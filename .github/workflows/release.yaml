# This workflow publishes the Node package (TypeScript) to NPM when changes are pushed to main
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release to NPM

on:
    push:
        branches:
            - main

permissions:
    contents: read # allow workflows to only (read or write) in the repo

jobs:
    NPM-Release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Build the package
              run: npm run build

            - name: Verify integrity
              run: npm audit signatures

            - name: Release
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  V=$(node -p "require('./package.json').version")
                  if npm view @willphan1712000/frontend@$V version >/dev/null 2>&1; then
                    echo "Version $V already published, skipping"
                  else
                    npm publish --access=public
                  fi
