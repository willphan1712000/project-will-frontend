# This workflow builds the Node package (TypeScript) and verifies NPM authentication
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Node Package (Typescript) to NPM

on:
    push:
        branches:
            - dev

permissions:
    contents: read # allow workflows to only (read or write) in the repo

jobs:
    NPM-Release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'
                  registry-url: 'https://registry.npmjs.org'

            - name: check whoami and token
              run: npm whoami
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Install dependencies
              run: npm ci

            - name: Build the package
              run: npm run build
